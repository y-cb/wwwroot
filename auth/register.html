function login_out() {
	$.ajax({
		url: 'authweb_success.php',
		type: 'POST',
		data: 'submit=webauthloginout',
		async: false,
		timeout: 30000,
		success: function(data) {
			$('#auth_name').val('');
			$('#auth_pwd').val('');
			if (get_weburl()) location.href = '/?weburl=' + get_weburl();
			else location.href = '/';
		}
	});
}

function get_param() {
	var arr = {};
	var tmp = window.location.search.substring(1);
	var vars = tmp.split('&');
	if (tmp.length !=0 && vars.length != 0) {
		for (var i = 0; i < vars.length; i++) {
			var pair = vars[i].split('=');
			arr[pair[0]] = pair[1];
		}
	}

	return arr;
}

function form_submit() {
	var obj = get_param();
	var usr = $("#usr_cid").val();
	var msg1="<?php echo getCommonResource('auth.safety.notemptyusername');?>";
	var msg2="<?php echo getCommonResource('auth.safety.notintherangeusername');?>";
	var msg3="<?php echo getCommonResource('auth.safety.correctusername');?>";
	$("#error").html('');

	if ( !! usr == false) {
		$("#error").html(msg1);
		$('#usr_cid').focus();
		return false;
	}
	if (getStringByteLength(usr) < 1 || getStringByteLength(usr) > 31) {
		$("#error").html(msg2);
		$('#usr_cid').focus();
		return false;
	}	
	if (/[\\\'\"\<\>\+\?\#\&\s]/.test(usr)) {
		$("#error").html(msg3);
		$('#usr_cid').focus();
		return false;
	}
	$.ajax({
		url: 'register.php?act=register&t=' + Math.random(),
		type: 'POST',
		data: {visitor: usr, visit_ip: obj.ip, time: obj.time},
		async: false,
		timeout: 30000,
		success: function(data) {
			if (data == 'success') {
				$("#info").hide();
				$("#login_result_cid").show();
			} else {
				var arr = data.split('#');
				if(arr[1]=='check_num_error'){
					$("#error").html(msg8);
					//alert(msg8);
				} else{
					$("#error").html(arr[1]);
					//alert(msg5);
				}
			}
		}
	});
}
