function login_out() {
	$.ajax({
		url: 'qrcode_encrypt.php?act=qrcode_logout',
		type: 'POST',
		data: {name: $("#login_username").html(), ip: $("#login_ip").html()},
		async: false,
		timeout: 30000,
		success: function(data) {
			$("#login_username").html('');
			$("#login_ip").html('');
			clearTimeout(resultInterval);

			myInterval = window.setInterval(function() {
				changeQRcode();
			},param.t * 1000);

			statusInterval = window.setInterval(function(){
				getLoginStatus();
			}, 2000);

			$("#result").hide();
			$("#info").show();
		}
	});
}

function get_param() {
	var arr = {};
	var tmp = window.location.search.substring(1);
	var vars = tmp.split('&');
	if (tmp.length !=0 && vars.length != 0) {
		for (var i = 0; i < vars.length; i++) {
			var pair = vars[i].split('=');
			arr[pair[0]] = pair[1];
		}
	}

	return arr;
}

function changeQRcode() {
	// var timestamp = new Date().getTime();
	var param = get_param();
	// console.log(param, 'param');
	if(Object.keys(param).length == 0){
		window.location.href = '/index.html';
	}
	document.getElementById('qrcode').src = "/qrcode_encrypt.php?act=qrcode_generate&ip=" + param.ip + "&time=" + param.t;
}

function getLoginStatus() {
	var param = get_param();
	$.ajax({
		url: 'qrcode_encrypt.php?act=qrcode_login_status',
		type: 'POST',
		data: {ip: param.ip},
		async: false,
		timeout: 30000,
		success: function(data) {
			clearTimeout(statusInterval);
			if (data == '0') {
				$("#info").show();
				$("#result").hide();
				statusInterval = setTimeout(function(){
					getLoginStatus();
				}, 2000);
			} else {
				var interval = '';
				var arr = data.split('&');
				$('#login_username').html(arr[0]);
				$('#login_ip').html(arr[1]);
				$('#login_time').html(arr[2]);
				$("#login_duration_timer").val(arr[3]);
				$("#info").hide();
				$("#result").show();
				clearTimeout(myInterval);
				clearTimeout(interval);

				interval = setTimeout(function(){
					getLoginStatus();
				}, 30 * 1000);

			}
			/*$('#auth_name').val('');
			$('#auth_pwd').val('');
			if (get_weburl()) location.href = '/?weburl=' + get_weburl();
			else location.href = '/';*/
		}
	});
}
