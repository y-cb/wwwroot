	<script>
		function isCharIn(str, valid) {
			var str = str.trim();
			for (var i = 0; i < str.length; i += 1) {
				for (var j = 0; j < valid.length; j += 1) {
					if (str.charAt(i) == valid.charAt(j)) {
						return true
					}
				}
			}
			return false;
		}

		function form_submit() {
			var name_str = $("#name_cid").val(),
				password_str = $("#password_cid").val();
			var $error_notice = $(".error_notice"),
				$error_notice_div = $(".error_notice div");
				$error_notice.css("display", "block");
			if (!!name_str == false) {
				$error_notice_div.html("<?php echo getCommonResource("sslvpn_error.usernull");?>")
				return false;
			}

			if (!!password_str == false) {
				$error_notice_div.html("<?php echo getCommonResource("sslvpn.cant.empty");?>")
				return false;
			}
			// var result = (isCharIn(password_str, '0123456789') && isCharIn(password_str, 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ') && isCharIn(password_str, '!@#$%&`,-.'));
			// if (!result) {
				// $error_notice_div.html("<?php //"密码不符合规则"; ?>");
				// return false;
			// }
			$.ajax({
				url : '/login.html',
				type : 'POST',
				data : 'username=' + window.btoa(encodeURI(name_str)) + '&password=' + window.btoa(password_str) + '&submit=webauthlogin',
				async : false,
				timeout : 30000,
