<script>
    var domainReg =
        /[a-zA-Z0-9][-a-zA-Z0-9]{0,62}(\.[a-zA-Z0-9][-a-zA-Z0-9]{0,62})+\.?/; // 域名验证
    var hashReg = /^([0-9A-Fa-f]{32}|[0-9A-Fa-f]{40}|[0-9A-Fa-f]{64})$/; // hash验证
    var ipReg =
        /^((2[0-4]\d|25[0-5]|[01]?\d\d?)\.){3}(2[0-4]\d|25[0-5]|[01]?\d\d?)$/; // ip验证
    var emailReg =/^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;

</script>
<script>
  window.onload= function(){
      console.log('version:',config.version);

      function pageload(url,callback){
          var xhr=new XMLHttpRequest();
          try {
              xhr.open('GET',url,true);
              xhr.timeout = 2000;
              xhr.onreadystatechange=function(){
                  // readyState == 4说明请求已完成
                  if(xhr.readyState==4){
                      if(xhr.status==200){
                          callback(xhr);
                      }else{
                          callback(xhr);
                      }
                  }
              };
              xhr.send();
          }catch (e) {
              hasNET = false
          }
      }

      if(navigator.onLine){
          pageload(config.status,function(res) {
              if (res.responseText == 'true') {
                  hasNET = true
              } else {
                  hasNET = false;
              }
          });
      }else{
          hasNET = false
      }
      function xhrGet(url,callback){
          var xhr=new XMLHttpRequest();
           try {
               xhr.open('GET',url,true);
               xhr.onreadystatechange=function(){
                   // readyState == 4说明请求已完成
                   if(xhr.readyState==4){
                       if(xhr.status==200){
                           callback(xhr.responseText);
                       }else{
                           console.log(xhr.responseText)
                       }
                       console.log(xhr.responseText)
                   }
               };
               xhr.send();
           }catch (e) {
               hasNET = false
           }
      }
      setConfig();

      var qrcode = null;
      var timeOut = null;
      // var pre_pageEle = document.getElementById('pre_page');
      // var next_pageEle = document.getElementById('next_page');
      // var reloadEle = document.getElementById('reload');
      // var toHomeEle = document.getElementById('toHome');
      var messageEle = document.getElementById('message');
      var search_ipt = document.getElementById('search_ipt');
      var foo_1 = document.getElementById('foo_1');
      var lastWordClose = document.getElementById('lastWordClose');
      var lastWordContent = document.getElementById('lastWordContent');
      //
      // pre_pageEle.addEventListener('click',function(){
      //     window.history.go(-1)
      // })
      // next_pageEle.addEventListener('click',function(){
      //     window.history.go()
      // })
      // reloadEle.addEventListener('click',function () {
      //     window.location.reload()
      // })
      // toHomeEle.addEventListener('click',function(){
      //     window.location.reload()
      // })

      var close = document.getElementById('close');
      var dialog_wrapper = document.getElementById('dialog_wrapper');
      close.addEventListener('click',function (e) {
          dialog_wrapper.style.display = 'none';
          foo_1.setAttribute('data-clipboard-text','')
      });

      lastWordClose.addEventListener('click',function(){
          lastWordContent.innerHTML  = '';
          setLocalStorage('lastSearchWord','');
      });

      // dialog_wrapper.addEventListener('click',function (e) {
      //     dialog_wrapper.style.display = 'none';
      //     foo_1.setAttribute('data-clipboard-text','');
      //     e.stopPropagation()
      //     e.stopImmediatePropagation();
      // },true);

      var lastWord = document.getElementById('lastWord');
      search_ipt.addEventListener('focus',function (e) {
          lastWord.style.display = 'block';
      });
      search_ipt.addEventListener('blur',function (ev) {
          var timer = null;
          timer = setTimeout(()=>{
            lastWord.style.display = 'none';
          clearTimeout(timer);
          },300)
      },true);

      var clipboard = new ClipboardJS('#foo_1');
      clipboard.on('success', function(e) {
          showMessage('复制成功！',2000,'success');
          e.clearSelection();
      });

      clipboard.on('error', function(e) {
          showMessage('复制失败！',2000,'error');
          alert('复制失败')
      });

      //搜索
      var search_btn = document.getElementById('search_btn');
      search_btn.addEventListener('click',function(){
          if(checkIsXSS(search_ipt.value)){
              showMessage('无效的ioc查询！',2000,'error');
              return false;
          }
          var search_text = html_encode(search_ipt.value);
          if(search_text.trim()!==''){
              toSearch();
          }else{
              showMessage('请输入查询内容',2000,'warning');
              search_ipt.value=''
          }
      });

      search_ipt.addEventListener('keyup',function(e){
          if(e.keyCode!==13) return false;
          var search_text = search_ipt.value;
          if(search_text.trim()!==''){
              toSearch();
          }else{
              showMessage('请输入查询内容',2000,'warning');
              search_ipt.value=''
          }
      });

      function checkIsXSS(v){/*xss校验函数，返回值：true 表示存在xss漏洞，false：不存在*/
          if (typeof v =="string" && v) {
              // var exp=new RegExp("\\b(document|onload|eval|script|img|svg|onerror|javascript|alert)\\b");
              var exp=new RegExp(/[<">']/g);
              return exp.test(v);
          }
          return false;
      }

      function html_encode(str) {
          let s = '';
          if (str.length === 0) return '';
          s = str.replace(/&/g, '&gt;');
          s = s.replace(/</g, '&lt;');
          s = s.replace(/>/g, '&gt;');
          return s;
      };

      function toSearch(){
          var search_text = search_ipt.value.trim();
          if(!hashReg.test(search_text)&&!domainReg.test(search_text)&&!emailReg.test(search_text)&&!ipReg.test(search_text)){
              showMessage('ioc格式错误',2000,'warning');
          }else{
              saveLastSearch(search_text);
              if(navigator.onLine){
                  if(hasNET){
                      window.location.href = '/static/views/jssdk_detail.html?ioc='+search_text.trim()
                  }else{
                      setSdkToken(search_text)
                  }
              }else{
                  setSdkToken(search_text)
              }
          }
      }
       function setSdkToken(search_text){
           var sdkToken = getLocalStorage('sdkToken');
           if(!!sdkToken){
               setOutLine(search_text, sdkToken)
           }else{
               xhrGet(config.sdk_token_path,function(res){
                console.log(res,1234567);
                   let data = JSON.parse(res);
                   setLocalStorage('sdkToken',data.data,20);
                   setOutLine(search_text, data.data)
               })
           }
       }

      function setOutLine(search_text, sdkToken){
          dialog_wrapper.style.display = 'block';
          // var resultUrl = document.getElementById('resultUrl');
          rawQrcode('qrCode',config.tiPath + typeTest(search_text)+'/'+search_text+'/?sdk_token='+sdkToken);
          // resultUrl.innerText = config.tiPath + typeTest(search_text)+'/'+search_text+'/?sdk_token='+sdkToken
          foo_1.setAttribute('data-clipboard-text',config.tiPath + typeTest(search_text)+'/'+search_text+'/?sdk_token='+sdkToken)
          setLastSearch()
      }

      //上传文件
      document.getElementById('file').addEventListener('change', function () {
          var blobSlice = File.prototype.slice || File.prototype.mozSlice || File.prototype.webkitSlice,
              file = this.files[0],
              chunkSize = 2097152,                             // Read in chunks of 2MB
              chunks = Math.ceil(file.size / chunkSize),
              currentChunk = 0,
              spark = new SparkMD5.ArrayBuffer();
              //最大40M
              if(this.files[0].size>40*1024*1024){
                  showMessage('上传文件不能超过40M',2000,'warning');
                  return false;
              }
          if(navigator.onLine){
              if(hasNET){
                  toUpload(this.files[0])
              }else{
                  outLine_upload(file,blobSlice,currentChunk,chunks,chunkSize,spark)
              }
          }else{
              outLine_upload(file,blobSlice,currentChunk,chunks,chunkSize,spark)
          }
      });

      function outLine_upload(file,blobSlice,currentChunk,chunks,chunkSize,spark){
          var fileReader = new FileReader();
          fileReader.onload = function (e) {
              spark.append(e.target.result);                   // Append array buffer
              currentChunk++;
              if (currentChunk < chunks) {
                  loadNext();
              } else {
                  var hash = spark.end();
                  saveLastSearch(hash);
                  if(navigator.onLine){
                      window.location.href = '/static/views/jssdk_detail.html?ioc='+hash.trim()
                  }else{
                      search_ipt.value = hash;
                      var sdkToken = getLocalStorage('sdkToken');
                      if(!!sdkToken){
                          setOutLine(hash, sdkToken)
                      }else{
                          xhrGet(config.sdk_token_path,function(res){
                              let data = JSON.parse(res);
                              setLocalStorage('sdkToken',data.data,20);
                              setOutLine(hash, data.data)
                          })
                      }
                  }
              }
          };
          fileReader.onerror = function () {
              console.warn('oops, something went wrong.');
          };
          function loadNext() {
              var start = currentChunk * chunkSize,
                  end = ((start + chunkSize) >= file.size) ? file.size : start + chunkSize;
              fileReader.readAsArrayBuffer(blobSlice.call(file, start, end));
          }
          loadNext();
      }

      //消息提示
      function showMessage(text,time,type){
          if(type=='success'){
              messageEle.style.color = '#67c23a';
              messageEle.style.background = '#f0f9eb';
              messageEle.style.borderColor = '#c2e7b0';
          }else if(type=='warning'){
              messageEle.style.color = '#e6a23c';
              messageEle.style.background = '#fdf6ec';
              messageEle.style.borderColor = '#faecd8';
          }else if(type=='error'){
              messageEle.style.color = '#f56c6c';
              messageEle.style.background = '#fef0f0';
              messageEle.style.borderColor = '#fbc4c4';
          }
          if(!timeOut){
              messageEle.style.top = '20px';
              messageEle.style.opacity = '1';
              messageEle.innerText = text;
              timeOut = setInterval(()=>{
                  messageEle.style.top = '-40px';
                  messageEle.style.opacity = '0';
                  messageEle.innerText = '';
                  clearTimeout(timeOut);
                  timeOut = null
              },time)
          }
      }

      //配置示例点击
      function sethotWorld(dom){
          var dom = document.getElementsByClassName(dom);
          for(let i=0;i<dom.length;i++){
              dom[i].addEventListener('click',function (e) {
                  if(checkIsXSS(dom[i].innerText)){
                      showMessage('无效的ioc查询！',2000,'error');
                      return false;
                  }
                  search_ipt.value = html_encode(dom[i].innerText);
                  var value = dom[i].innerText;
                  saveLastSearch(value);
                  lastWord.style.display = 'none';
                  if(navigator.onLine){
                      if(hasNET){
                          window.location.href = '/static/views/jssdk_detail.html?ioc='+value.trim()
                      }else{
                          setSdkToken(value)
                      }
                  }else{
                      var sdkToken = getLocalStorage('sdkToken');
                      if(!!sdkToken){
                          setOutLine(value, sdkToken)
                      }else{
                          xhrGet(config.sdk_token_path,function(res){
                              let data = JSON.parse(res);
                              setLocalStorage('sdkToken',data.data,20);
                              setOutLine(value, data.data)
                          })
                      }
                  }
              })
          }
      }
      setLastSearch();
      //配置最近搜索
      function setLastSearch(){
          var lastSearch_10 = getLocalStorage('lastSearchWord')||'';
          var list_word = lastSearch_10.split(',');
          list_word = trim(list_word);
          if(list_word.length<=0)return false;
          var str = '';
          lastWordContent.innerHTML = '';
          for(let i = 0;i<list_word.length;i++){
              str+='<span class="hot_world fl">'+html_encode(list_word[i])+'</span>'
          }
          lastWordContent.innerHTML = str;
          sethotWorld('hot_world')
      }

      //保存最近搜索
      function saveLastSearch(text){
          console.log(text);
          var lastSearch_10 = getLocalStorage('lastSearchWord')||'';
          var list_word = lastSearch_10.split(',');
          if(list_word.length>=10){
              list_word.pop();
          }
          list_word.unshift(html_encode(text));
          list_word = unique(list_word);
          setLocalStorage('lastSearchWord',list_word.join(','),8*60)
      }

      //数组排空
      function trim(list){
          return list.filter(function (s) {
              return s && s.trim();
          });
      }

      function unique( arr ){
          arr = arr.sort();
          var arr1 = [arr[0]];
          for(var i=1,len=arr.length;i<len;i++){
              if(arr[i] !== arr[i-1]){
                  arr1.push(arr[i]);
              }
          }
          return arr1;
      }

      //生成二维码
      function rawQrcode(dom,url){
          document.getElementById('qrCode').innerHTML = '';
          document.getElementById('qrCode').style.display = 'block';
          if(!!qrcode){
              qrcode.clear();
          }
          qrcode = new QRCode(dom, {
              text: url,
              width: 128,
              height: 128,
              colorDark : "#000000",
              colorLight : "#ffffff",
              correctLevel : QRCode.CorrectLevel.H
          });
      }

      //校验ioc类型
      function typeTest(ioc){
          if(hashReg.test(ioc)){
              return 'hash'
          }else if(ipReg.test(ioc)){
              return 'ip'
          }else if(emailReg.test(ioc)){
              return 'mail'
          }else if(domainReg.test(ioc)){
              return 'domain'
          }else{
              return 'str'
          }
      }

      function setConfig(){
          document.getElementById('title').innerText = config.pageTitle;
          document.getElementById('search_ipt').setAttribute('placeholder',config.searchPlace);
          var temp_content = document.getElementById('temp_content');
          temp_content.innerHTML = '<div class="templ_list fl">搜索示例：</div>';
          var hotworld = getLocalStorage('hotWord')||config.hotWords;
          var hotworldList =  hotworld.split(',');
          for(let i=0;i<hotworldList.length;i++){
              temp_content.innerHTML  +=  '<span class="temp_list fl">'+hotworldList[i]+'</span>'
          }
          sethotWorld('temp_list')
      }

      // 设置LocalStorage过期
      function setLocalStorage  (key, value, days) {
          value = JSON.stringify(value);
          // 设置过期原则
          if (!value) {
              localStorage.removeItem(key)
          } else {
              var Days = days || 3*60 ; // 以小时为单位，默认24小时
              var exp = new Date();
              localStorage[key] = JSON.stringify({
                  value,
                  expires: exp.getTime() + Days * 1000*60
              })
          }
      }

      function getLocalStorage (name) {
          try {
              let o = JSON.parse(localStorage[name]);
              if (!o || o.expires < Date.now()) {
                  return ''
              } else {
                  return JSON.parse(o.value)
              }
          } catch (e) {
              // 兼容其他localstorage
              return localStorage[name]
          }
      }
      function toUpload(file) {
          var freeToken = getLocalStorage('freeToken');
          if(!!freeToken){
              uploadFile(file)
          }else{
              var sdkToken = getLocalStorage('sdkToken');
              if(!!sdkToken){
                  to_upLoadFile(sdkToken, file)
              }else{
                  xhrGet(config.sdk_token_path,function(res){
                      let data = JSON.parse(res);
                      setLocalStorage('sdkToken',data.data,20);
                      to_upLoadFile(data.data, file)
                  })
              }
          }
      }


      function to_upLoadFile(sdkToken,file){
          var xmlhttp;
          xmlhttp = new XMLHttpRequest();
          xmlhttp.open("GET", config.free_token + '?sdkToken=' + sdkToken, true);
          xmlhttp.withCredentials = true;
          xmlhttp.onreadystatechange=function(){
              if(xmlhttp.readyState==4){
                  if(xmlhttp.status==200){
                      var xmlhttpResult = JSON.parse(xmlhttp.responseText);
                      var freeToken = xmlhttpResult.ret.token||"";
                      setLocalStorage('freeToken',freeToken,3*60);
                      uploadFile(file)
                  }
              }
          };
          xmlhttp.send();
      }

      function uploadFile(file) {
          var freeToken = getLocalStorage('freeToken');
              var progress = document.getElementById('progress');
              var formData = new FormData();
              formData.append("file", file);
              var xhr = new XMLHttpRequest();
              xhr.onreadystatechange = function() {
                  if (xhr.readyState === 4 && xhr.status === 200) {
                      var res = JSON.parse(xhr.responseText).ret;
                      saveLastSearch(res);
                      window.location.href = '/static/views/jssdk_detail.html?ioc=' + res.trim()
                  }
              };
              xhr.upload.addEventListener("progress", function(event) {
                  var width = Math.ceil(event.loaded * 100 / event.total);
                  if(event.lengthComputable){
                      progress.style.width =  width+ "%";
                      if(width<100){
                          progress.style.display = 'block';
                      }else{
                          progress.style.display = 'none';
                      }
                  }
              }, false);
              xhr.open("POST", config.uploadfile);
              xhr.setRequestHeader('Authorization',freeToken);
              xhr.send(formData);
      }

  }
</script>
