<script>
    var domainReg =
        /[a-zA-Z0-9][-a-zA-Z0-9]{0,62}(\.[a-zA-Z0-9][-a-zA-Z0-9]{0,62})+\.?/; // 域名验证
    var hashReg = /^([0-9A-Fa-f]{32}|[0-9A-Fa-f]{40}|[0-9A-Fa-f]{64})$/; // hash验证
    var ipReg =
        /^((2[0-4]\d|25[0-5]|[01]?\d\d?)\.){3}(2[0-4]\d|25[0-5]|[01]?\d\d?)$/; // ip验证
    var emailReg =/^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
</script>
<script>
    window.onload= function(){
        console.log('version:',config.version);
        function pageload(url,callback){
            var xhr=new XMLHttpRequest();
            try {
                xhr.open('GET',url,true);
                xhr.timeout = 2000;
                xhr.onreadystatechange=function(){
                    // readyState == 4说明请求已完成
                    if(xhr.readyState==4){
                        if(xhr.status==200){
                            callback(xhr);
                        }else{
                            callback(xhr);
                        }
                    }
                };
                xhr.send();
            }catch (e) {
                hasNET = false
            }
        }
        var messageEle = document.getElementById('message');
        var qrcode = null;
        var timeOut = null;
        var foo_1 = document.getElementById('foo_1');
        function setSdkToken(search_text){
            var sdkToken = getLocalStorage('sdkToken');
            if(!!sdkToken){
                setOutLine(search_text, sdkToken)
            }else{
                xhrGet(config.sdk_token_path,function(res){
                  console.log(res,3457)
                    let data = JSON.parse(res);
                    setLocalStorage('sdkToken',data.data,20);
                    setOutLine(search_text, data.data)
                })
            }
        }

        function setOutLine(search_text, sdkToken){
            // var resultUrl = document.getElementById('resultUrl');
            rawQrcode('qrCode',config.tiPath + typeTest(search_text)+'/'+search_text+'/?sdk_token='+sdkToken);
            foo_1.setAttribute('data-clipboard-text',config.tiPath + typeTest(search_text)+'/'+search_text+'/?sdk_token='+sdkToken)
        }
        var clipboard = new ClipboardJS('#foo_1');
        clipboard.on('success', function(e) {
            showMessage('复制成功！',2000,'success');
            e.clearSelection();
        });

        clipboard.on('error', function(e) {
            showMessage('复制失败！',2000,'error');
            alert('复制失败')
        });

        //校验ioc类型
        function typeTest(ioc){
            if(hashReg.test(ioc)){
                return 'hash'
            }else if(ipReg.test(ioc)){
                return 'ip'
            }else if(emailReg.test(ioc)){
                return 'mail'
            }else if(domainReg.test(ioc)){
                return 'domain'
            }else{
                return 'str'
            }
        }

        //生成二维码
        function rawQrcode(dom,url){
            document.getElementById('qrCode').innerHTML = '';
            document.getElementById('qrCode').style.display = 'block';
            if(!!qrcode){
                qrcode.clear();
            }
            qrcode = new QRCode(dom, {
                text: url,
                width: 128,
                height: 128,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }

        var tiDetail = document.getElementById('tiDetail');
        // var pre_page = document.getElementById('pre_page');
        // var next_page = document.getElementById('next_page');
        var reload = document.getElementById('reload');
        var toHome = document.getElementById('toHome');
        // pre_page.addEventListener('click',function(){
        //     window.history.go(-1)
        // })
        // next_page.addEventListener('click',function(){
        //     window.history.go(1)
        // })
        reload.addEventListener('click',function () {
             // tiDetail.content
             window.location.reload()
        //     // alert(document.getElementById('tiDetail').location)
        //     // console.log(document.getElementById('tiDetail').contentWindow.document.getElementById("id"))
        //     // console.log(window.frames[0].contentWindow.document.getElementById("id"))
        //     //
        //     // window.open(document.getElementById('tiDetail').src,'refresh_name','')
         })
        toHome.addEventListener('click',function(){
            window.location.href= 'jssdk.html'
        })


        function getIocType(sdkToken, ioc){
            xhrGet(config.ioc_type + '?ioc=' + ioc,function(res){
                let data = JSON.parse(res);
                let type;
                if(data.ret.type=='file'||data.ret.type=='hash'){
                    type = 'hash'
                }else{
                    type=data.ret.type;
                }
                tiDetail.setAttribute('src',config.tiPath + type+'/'+data.ret.ioc+'/?sdk_token='+sdkToken)
            })
        }

        function GetQueryString (name){
            // var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
            var arr = decodeURI(window.location.search).substr(1).split('=');
            // console.log(arr)
            arr.shift();
            var str = '';
            if (arr != []) {
                arr.map(item => {
                    str+=item;
                });
                // console.log(str)
                return str;
            };
            return null;
        }

        // 设置LocalStorage过期
        function setLocalStorage  (key, value, days) {
            value = JSON.stringify(value);
            // 设置过期原则
            if (!value) {
                localStorage.removeItem(key)
            } else {
                var Days = days || 3*60 ; // 以小时为单位，默认24小时
                var exp = new Date();
                localStorage[key] = JSON.stringify({
                    value,
                    expires: exp.getTime() + Days * 1000*60
                })
            }
        }

        function getLocalStorage (name) {
            try {
                let o = JSON.parse(localStorage[name]);
                if (!o || o.expires < Date.now()) {
                    return ''
                } else {
                    return JSON.parse(o.value)
                }
            } catch (e) {
                // 兼容其他localstorage
                return localStorage[name]
            }
        }

        //消息提示
        function showMessage(text,time,type){
            if(type=='success'){
                messageEle.style.color = '#67c23a';
                messageEle.style.background = '#f0f9eb';
                messageEle.style.borderColor = '#c2e7b0';
            }else if(type=='warning'){
                messageEle.style.color = '#e6a23c';
                messageEle.style.background = '#fdf6ec';
                messageEle.style.borderColor = '#faecd8';
            }else if(type=='error'){
                messageEle.style.color = '#f56c6c';
                messageEle.style.background = '#fef0f0';
                messageEle.style.borderColor = '#fbc4c4';
            }
            if(!timeOut){
                messageEle.style.top = '20px';
                messageEle.style.opacity = '1';
                messageEle.innerText = text;
                timeOut = setInterval(()=>{
                    messageEle.style.top = '-40px';
                    messageEle.style.opacity = '0';
                    messageEle.innerText = '';
                    clearTimeout(timeOut);
                    timeOut = null
                },time)
            }
        }
        if(navigator.onLine){
            pageload(config.status,function(res){
                var ioc = GetQueryString('ioc');
                document.getElementById('page_wrapper').style.display  = 'block';
                if(res.responseText=='true'){
                    hasNET = true
                } else {
                    hasNET = false;
                }
                if(!hasNET){
                    document.getElementById('iframe_wrapper').style.display = 'none';
                    document.getElementById('outLine_wrapper').style.display = 'block';
                    setSdkToken(ioc);
                }

                if(!!ioc&&hasNET){
                    var sdkToken = getLocalStorage('sdkToken');
                    if(!!sdkToken){
                        xhrGet(config.ioc_type + '?ioc=' + ioc,function(res){
                            let data = JSON.parse(res);
                            let type;
                            if(data.ret.type=='file'||data.ret.type=='hash'){
                                type = 'hash'
                            }else{
                                type=data.ret.type;
                            }
                            tiDetail.setAttribute('src',config.tiPath + type+'/'+data.ret.ioc+'/?sdk_token='+sdkToken)
                        })
                    }
                    else{
                        var sdkToken = getLocalStorage('sdkToken');
                        if(!!sdkToken){
                            getIocType(sdkToken, ioc)
                        }else{
                            xhrGet(config.sdk_token_path,function(res){
                                let data = JSON.parse(res);
                                setLocalStorage('sdkToken',data.data,20);
                                getIocType(data.data, ioc)
                            })
                        }
                    }
                }
            });
        }else{
            hasNET = false;
            document.getElementById('iframe_wrapper').style.display = 'none';
            document.getElementById('outLine_wrapper').style.display = 'block';
            var ioc = GetQueryString('ioc');
            setSdkToken(ioc);
        }
    }
</script>
</body>
</html>
